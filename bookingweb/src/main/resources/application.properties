spring.application.name=book

spring.datasource.url=jdbc:sqlite:booking_system.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

spring.main.banner-mode=OFF
logging.level.jdbc=OFF
logging.level.org.community.booking=DEBUG
spring.jackson.deserialization.fail-on-null-for-primitives=false


server.forward-headers-strategy=framework

# JWT Configuration
jwt.secret=defaultSecretKeyForCommunityBookingAppSecure256BitsMinimum!
jwt.expiration=86400000

# CORS Configuration
cors.allowed=http://localhost:5173,https://localhost:5173

# Registration Plugin Configuration
book.user.add=true

# SMTP configuration
app.smtp.host=smtp.gmail.com
app.smtp.port=587
app.smtp.user=<gmail email sender>
app.smtp.password=<google api key>
app.confirm.url=http://localhost:8080/confirmuser
